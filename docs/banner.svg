<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ExpoTÉCNICA 2026 — Sistema de calificación de proyectos">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB783"/>
      <stop offset="50%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#BB9AF7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.15" cy="0.15" r="0.8">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.9" cy="0.9" r="0.65">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2335" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0D1117"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.5"/>
    <rect width="1200" height="320" fill="url(#warm)"/>
    <rect width="1200" height="320" fill="url(#cool)"/>
    <rect width="1200" height="4" fill="url(#line)"/>

    <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
      <text x="72" y="86" fill="#565F89" font-size="15" letter-spacing="6" font-weight="600">EXPO TÉCNICA · COVAO</text>

      <text x="68" y="168" font-size="64" font-weight="700" fill="url(#title)">ExpoTÉCNICA 2026</text>

      <text x="72" y="214" fill="#C0CAF5" font-size="24" font-weight="500">Sistema de gestión y calificación de proyectos</text>

      <g font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13">
        <g transform="translate(72 252)">
          <rect width="92" height="30" rx="8" fill="#161B22" stroke="#2A2F45"/>
          <text x="46" y="20" fill="#FFB783" text-anchor="middle">Laravel 13</text>
        </g>
        <g transform="translate(174 252)">
          <rect width="62" height="30" rx="8" fill="#161B22" stroke="#2A2F45"/>
          <text x="31" y="20" fill="#9ECE6A" text-anchor="middle">PHP 8.4</text>
        </g>
        <g transform="translate(246 252)">
          <rect width="82" height="30" rx="8" fill="#161B22" stroke="#2A2F45"/>
          <text x="41" y="20" fill="#7DCFFF" text-anchor="middle">MySQL 8</text>
        </g>
        <g transform="translate(338 252)">
          <rect width="86" height="30" rx="8" fill="#161B22" stroke="#2A2F45"/>
          <text x="43" y="20" fill="#7AA2F7" text-anchor="middle">Docker</text>
        </g>
      </g>
    </g>

    <g transform="translate(880 96)" font-family="Cascadia Code, Consolas, Menlo, monospace">
      <circle cx="0" cy="0" r="86" fill="none" stroke="#E67E22" stroke-opacity="0.16"/>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#BB9AF7" stroke-opacity="0.18"/>
      <text x="0" y="8" fill="url(#title)" font-size="42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">2026</text>
      <text x="0" y="36" fill="#565F89" font-size="11" letter-spacing="3" text-anchor="middle">EDICIÓN</text>
    </g>
  </g>
</svg>
